name: Feature Request
description: Propose an enhancement or new feature for Isabella
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the sections below to help us understand your proposal.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What need does it address?
      placeholder: "I'm frustrated when... / It would be helpful if... / Users need..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or enhancement you'd like to see
      placeholder: |
        Describe your proposed solution in detail:
        - What should it do?
        - How should it work?
        - What should the user experience be?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or features?
      placeholder: |
        - Alternative 1: ...
        - Alternative 2: ...
        - Why the proposed solution is better: ...
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should be included and excluded from this feature?
      placeholder: |
        In scope:
        - Feature component 1
        - Feature component 2
        
        Out of scope:
        - Related feature X (can be done later)
        - Integration with Y (separate feature)
    validations:
      required: false

  - type: checkboxes
    id: implementation_areas
    attributes:
      label: Implementation Areas
      description: Which parts of the application would this feature affect?
      options:
        - label: Frontend (React/TypeScript UI)
        - label: Backend (FastAPI Python)
        - label: Database (MongoDB)
        - label: AI/ML (Models or algorithms)
        - label: API (New endpoints or changes)
        - label: Configuration
        - label: Documentation
        - label: Other (specify in additional context)

  - type: textarea
    id: risks
    attributes:
      label: Risks and Challenges
      description: What risks or challenges might this feature introduce?
      placeholder: |
        - Performance impact: ...
        - Breaking changes: ...
        - Security considerations: ...
        - Technical complexity: ...
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Mockups or Examples
      description: If applicable, provide mockups, diagrams, or examples from other applications
      placeholder: Drag and drop images, or provide links to examples

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (Blocking major use cases)
        - High (Significantly improves functionality)
        - Medium (Nice to have)
        - Low (Minor improvement)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, research, or information about the feature request
      placeholder: Any additional information that might be helpful...

  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      description: Would you be willing to help implement this feature?
      options:
        - label: I would like to implement this feature myself
        - label: I can help with testing this feature
        - label: I can help with documentation for this feature

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      description: Please verify the following before submitting
      options:
        - label: I have searched existing issues and feature requests to ensure this is not a duplicate
          required: true
        - label: I have provided all required information above
          required: true
        - label: This feature aligns with the project's goals and scope
          required: true
